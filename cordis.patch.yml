# The dsh-session-ide bundle layer: one insert row that is BOTH the
# host-half entry (workspace file server + Typert remote) and the
# browser-roster entry (the client-modules host half scans enabled Loader
# entries for packages declaring `dsh.client`). Activation is service-
# availability driven: the host half injects `sessions` and `typert`
# (mounted by dsh-base), and the browser half injects `slots` and `remote`
# (mounted by the web-app client composition).

- insert:
    - id: session-ide
      name: dsh-session-ide
